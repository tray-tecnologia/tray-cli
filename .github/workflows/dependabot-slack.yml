name: Send Dependabot Alerts to Slack

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  vulnerability-alerts: read

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous alert state
        uses: actions/cache/restore@v4
        with:
          path: dependabot-alerts-state.json
          key: dependabot-state-${{ github.run_id }}
          restore-keys: dependabot-state-

      - name: Check new alerts and notify Slack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          STATE_FILE="dependabot-alerts-state.json"

          FIRST_RUN=false
          if [ ! -f "$STATE_FILE" ]; then
            FIRST_RUN=true
            echo "[]" > "$STATE_FILE"
          fi

          # --paginate em endpoint de array emite arrays concatenados,
          # que não é JSON válido. Normaliza para um array único.
          gh api --paginate \
            "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            --jq '.[]' | jq -s '.' > alerts.json

          # Diferença de conjuntos em JSON: sem sort, sem comm, sem locale.
          NEW=$(jq -n \
            --slurpfile prev "$STATE_FILE" \
            --slurpfile curr alerts.json '
              ($prev[0] // [] | map(tostring) | INDEX(.)) as $seen
              | [ $curr[0][] | select($seen[.number | tostring] | not) ]
            ')

          COUNT=$(jq 'length' <<< "$NEW")

          if [ "$FIRST_RUN" = true ]; then
            echo "Primeira execução: semeando estado com $(jq length alerts.json) alertas, sem notificar."
          elif [ "$COUNT" -eq 0 ]; then
            echo "Nenhum alerta novo."
          else
            echo "Alertas novos: $COUNT"

            jq -c --arg repo "$REPO" '
              def esc: gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;");
              .[] | {
                blocks: [
                  { type: "section",
                    text: { type: "mrkdwn",
                            text: ":warning: *Novo alerta do Dependabot em* `\($repo)`" } },
                  { type: "section",
                    fields: [
                      { type: "mrkdwn",
                        text: "*Pacote:*\n`\(.dependency.package.name)`" },
                      { type: "mrkdwn",
                        text: "*Severidade:*\n*\(.security_advisory.severity | ascii_upcase)*" }
                    ] },
                  { type: "section",
                    text: { type: "mrkdwn",
                            text: "*Vulnerabilidade:*\n\(.security_advisory.summary | esc)" } },
                  { type: "actions",
                    elements: [
                      { type: "button",
                        text: { type: "plain_text", text: "Ver alerta no GitHub" },
                        url: .html_url,
                        style: "danger",
                        action_id: "open_dependabot_alert" }
                    ] }
                ]
              }' <<< "$NEW" > payloads.ndjson

            while IFS= read -r payload; do
              curl -sS --fail-with-body -X POST \
                -H 'Content-type: application/json' \
                --data "$payload" "$SLACK_WEBHOOK_URL"
              echo
              sleep 1
            done < payloads.ndjson
          fi

          jq '[.[].number]' alerts.json > "$STATE_FILE"

      - name: Save updated alert state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dependabot-alerts-state.json
          key: dependabot-state-${{ github.run_id }}
